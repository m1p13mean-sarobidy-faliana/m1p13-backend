openapi: '3.0.3'
info:
  title: Centre Commercial API
  description: |
    API de gestion de centre commercial (MEAN stack).

    ## Rôles
    - **ADMIN** : gestion complète (boutiques, catégories, utilisateurs, stats)
    - **SHOP_MANAGER** : gestion de sa propre boutique (produits, promotions)
    - **CUSTOMER** : navigation, favoris, avis

    ## Authentification
    Stratégie double token JWT :
    - **Access token** : 15 min — à envoyer dans `Authorization: Bearer <token>`
    - **Refresh token** : 7 jours — à envoyer dans le body pour rafraîchir

    Les tokens ne sont délivrés qu'après vérification de l'email.
  version: '1.0.0'

servers:
  - url: http://localhost:3001/api
    description: Serveur de développement

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Inscription, connexion, profil
  - name: Admin — Shops
    description: Gestion des boutiques (ADMIN)
  - name: Admin — Categories
    description: Gestion des catégories (ADMIN)
  - name: Admin — Stats
    description: Tableau de bord (ADMIN)
  - name: Admin — Users
    description: Gestion des utilisateurs (ADMIN)
  - name: My Shop
    description: Boutique du manager connecté (SHOP_MANAGER)
  - name: My Products
    description: Produits de la boutique du manager (SHOP_MANAGER)
  - name: My Promotions
    description: Promotions de la boutique du manager (SHOP_MANAGER)
  - name: Public
    description: Consultation publique (sans authentification)
  - name: Customer
    description: Fonctionnalités acheteur (CUSTOMER)
  - name: Articles
    description: Articles (SHOP_MANAGER / tous les authentifiés)

# ===========================================================================
# PATHS
# ===========================================================================
paths:

  # ---------------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: register
      summary: Inscription
      description: |
        Crée un compte. Les SHOP_MANAGER sont mis en statut WAITING (approbation admin requise).
        Un email de vérification est envoyé — les tokens JWT ne sont délivrés qu'après `/auth/verify-email/:token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Inscription réussie, email de vérification envoyé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Connexion standard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/login-mfa:
    post:
      tags: [Auth]
      security: []
      operationId: loginMfa
      summary: Connexion MFA — étape 1
      description: Valide les identifiants et envoie un code à 6 chiffres par email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Code MFA envoyé par email
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            type: string
                            description: ID à fournir à /auth/verify-mfa-code

  /auth/verify-mfa-code:
    post:
      tags: [Auth]
      security: []
      operationId: verifyMfaCode
      summary: Connexion MFA — étape 2
      description: Vérifie le code reçu par email et délivre les tokens JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, code]
              properties:
                user_id:
                  type: string
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Authentification MFA réussie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email/{token}:
    post:
      tags: [Auth]
      security: []
      operationId: verifyEmail
      summary: Vérification de l'adresse email
      description: Valide le token reçu par email et délivre les JWT.
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      responses:
        '200':
          description: Email vérifié, tokens délivrés
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh-token:
    post:
      tags: [Auth]
      security: []
      operationId: refreshToken
      summary: Rafraîchir l'access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nouveau access token généré
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      operationId: forgotPassword
      summary: Demande de réinitialisation de mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Email de réinitialisation envoyé (même réponse si l'email n'existe pas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  /auth/reset-password/{token}:
    post:
      tags: [Auth]
      security: []
      operationId: resetPassword
      summary: Réinitialisation du mot de passe
      parameters:
        - $ref: '#/components/parameters/TokenParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              properties:
                password:
                  type: string
                  format: password
                confirmPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Mot de passe réinitialisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/whoami:
    get:
      tags: [Auth]
      operationId: whoami
      summary: Profil de l'utilisateur connecté
      responses:
        '200':
          description: Profil retourné
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    put:
      tags: [Auth]
      operationId: updateProfile
      summary: Modifier son profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Déconnexion
      responses:
        '200':
          description: Déconnecté avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'

  # ---------------------------------------------------------------------------
  # ADMIN — SHOPS
  # ---------------------------------------------------------------------------
  /admin/shops:
    get:
      tags: [Admin — Shops]
      operationId: adminGetAllShops
      summary: Lister toutes les boutiques
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ShopStatus'
      responses:
        '200':
          description: Liste des boutiques
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/shops/{id}:
    get:
      tags: [Admin — Shops]
      operationId: adminGetShopById
      summary: Détail d'une boutique
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Boutique retournée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shop'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Shops]
      operationId: adminDeleteShop
      summary: Supprimer une boutique (cascade produits + promotions)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Boutique supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/shops/{id}/approve:
    put:
      tags: [Admin — Shops]
      operationId: approveShop
      summary: Approuver une boutique (→ ACTIVE, manager → VALID)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Boutique approuvée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shop'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/shops/{id}/suspend:
    put:
      tags: [Admin — Shops]
      operationId: suspendShop
      summary: Suspendre une boutique (→ SUSPENDED)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Boutique suspendue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shop'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # ADMIN — CATEGORIES
  # ---------------------------------------------------------------------------
  /admin/categories:
    get:
      tags: [Admin — Categories]
      operationId: adminGetAllCategories
      summary: Lister les catégories
      responses:
        '200':
          description: Liste des catégories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
    post:
      tags: [Admin — Categories]
      operationId: adminCreateCategory
      summary: Créer une catégorie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/categories/{id}:
    put:
      tags: [Admin — Categories]
      operationId: adminUpdateCategory
      summary: Modifier une catégorie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Catégorie mise à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Categories]
      operationId: adminDeleteCategory
      summary: Supprimer une catégorie
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Catégorie supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # ADMIN — STATS
  # ---------------------------------------------------------------------------
  /admin/stats/dashboard:
    get:
      tags: [Admin — Stats]
      operationId: getDashboardStats
      summary: Statistiques du tableau de bord
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardStats'

  # ---------------------------------------------------------------------------
  # ADMIN — USERS
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [Admin — Users]
      operationId: adminGetAllUsers
      summary: Lister tous les utilisateurs
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
    post:
      tags: [Admin — Users]
      operationId: adminCreateUser
      summary: Créer un utilisateur manuellement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  /users/search:
    get:
      tags: [Admin — Users]
      operationId: adminSearchUsers
      summary: Rechercher des utilisateurs
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Recherche générique }
        - { name: email, in: query, schema: { type: string } }
        - { name: first_name, in: query, schema: { type: string } }
        - { name: last_name, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/UserRole' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [Admin — Users]
      operationId: adminGetUserById
      summary: Détail d'un utilisateur
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Utilisateur retourné
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin — Users]
      operationId: adminUpdateUser
      summary: Modifier un utilisateur
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin — Users]
      operationId: adminDeleteUser
      summary: Supprimer un utilisateur
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Utilisateur supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # MY SHOP (SHOP_MANAGER)
  # ---------------------------------------------------------------------------
  /myshop:
    get:
      tags: [My Shop]
      operationId: getMyShop
      summary: Obtenir sa boutique
      responses:
        '200':
          description: Boutique du manager
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shop'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [My Shop]
      operationId: updateMyShop
      summary: Modifier sa boutique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShopInput'
      responses:
        '200':
          description: Boutique mise à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Shop'
        '404':
          $ref: '#/components/responses/NotFound'

  /myshop/stats:
    get:
      tags: [My Shop]
      operationId: getMyShopStats
      summary: Statistiques de sa boutique
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ShopStats'
        '404':
          $ref: '#/components/responses/NotFound'

  /myshop/reviews:
    get:
      tags: [My Shop]
      operationId: getMyShopReviews
      summary: Avis reçus sur sa boutique
      responses:
        '200':
          description: Liste des avis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'

  # ---------------------------------------------------------------------------
  # MY PRODUCTS (SHOP_MANAGER)
  # ---------------------------------------------------------------------------
  /myshop/products:
    get:
      tags: [My Products]
      operationId: getMyProducts
      summary: Lister ses produits
      responses:
        '200':
          description: Liste des produits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
    post:
      tags: [My Products]
      operationId: createProduct
      summary: Créer un produit (boutique doit être ACTIVE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'

  /myshop/products/{id}:
    put:
      tags: [My Products]
      operationId: updateProduct
      summary: Modifier un produit
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Produit mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [My Products]
      operationId: deleteProduct
      summary: Supprimer un produit
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Produit supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # MY PROMOTIONS (SHOP_MANAGER)
  # ---------------------------------------------------------------------------
  /myshop/promotions:
    get:
      tags: [My Promotions]
      operationId: getMyPromotions
      summary: Lister ses promotions
      responses:
        '200':
          description: Liste des promotions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Promotion'
    post:
      tags: [My Promotions]
      operationId: createPromotion
      summary: Créer une promotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionInput'
      responses:
        '201':
          description: Promotion créée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '403':
          $ref: '#/components/responses/Forbidden'

  /myshop/promotions/{id}:
    put:
      tags: [My Promotions]
      operationId: updatePromotion
      summary: Modifier une promotion
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionInput'
      responses:
        '200':
          description: Promotion mise à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Promotion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
