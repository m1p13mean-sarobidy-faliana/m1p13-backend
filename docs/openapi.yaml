# ===========================================================================
# COMPONENTS
# ===========================================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID MongoDB de la ressource
    TokenParam:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: Token de vérification (brut, non haché)

  responses:
    Unauthorized:
      description: Non authentifié — token manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Accès interdit — rôle insuffisant ou compte suspendu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflit — ressource déjà existante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Données invalides (validation échouée)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:

    # --- Envelopes ---
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    # --- Enums ---
    UserRole:
      type: string
      enum: [CUSTOMER, SHOP_MANAGER, ADMIN]

    UserStatus:
      type: string
      enum: [VALID, SUSPENDED, WAITING]

    ShopStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED]

    # --- Auth ---
    RegisterInput:
      type: object
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
        password:
          type: string
          format: password
          description: Min 8 caractères, lettres + chiffres
        first_name:
          type: string
        last_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          format: password

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: Valide 15 minutes
        refreshToken:
          type: string
          description: Valide 7 jours
        user:
          $ref: '#/components/schemas/UserProfile'

    UpdateProfileInput:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        address:
          type: string

    # --- Users ---
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        address:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'

    User:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          properties:
            emailVerified:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    # --- Categories ---
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    # --- Shops ---
    UpdateShopInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
          description: ID de la catégorie
        hours:
          type: string
          example: 'Lun-Sam 9h-19h'
        image:
          type: string

    Shop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        manager:
          $ref: '#/components/schemas/UserProfile'
        category:
          $ref: '#/components/schemas/Category'
        note:
          type: number
          minimum: 0
          maximum: 5
          description: Note moyenne calculée à partir des avis
        hours:
          type: string
        image:
          type: string
        status:
          $ref: '#/components/schemas/ShopStatus'
        createdAt:
          type: string
          format: date-time

    ShopStats:
      type: object
      properties:
        totalProducts:
          type: integer
        totalReviews:
          type: integer
        avgRating:
          type: number

    DashboardStats:
      type: object
      properties:
        totalShops:
          type: integer
        activeShops:
          type: integer
        pendingShops:
          type: integer
        totalCustomers:
          type: integer
        totalProducts:
          type: integer

    # --- Products ---
    ProductInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        image:
          type: string
        category:
          type: string
          description: ID de la catégorie
        isActive:
          type: boolean
          default: true

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        image:
          type: string
        shop:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Shop'
        category:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Category'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # --- Promotions ---
    PromotionInput:
      type: object
      required: [product, discountPercent, startDate, endDate]
      properties:
        product:
          type: string
          description: ID du produit
        discountPercent:
          type: integer
          minimum: 1
          maximum: 100
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: boolean
          default: true

    Promotion:
      type: object
      properties:
        id:
          type: string
        product:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Product'
        shop:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Shop'
        discountPercent:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # --- Reviews ---
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    Review:
      type: object
      properties:
        id:
          type: string
        user:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/UserProfile'
        shop:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    # --- Favorites ---
    Favorite:
      type: object
      properties:
        id:
          type: string
        user:
          type: string
        shop:
          $ref: '#/components/schemas/Shop'
        createdAt:
          type: string
          format: date-time

    # --- Articles (legacy) ---
    ArticleInput:
      type: object
      required: [title, content, price]
      properties:
        title:
          type: string
        content:
          type: string
        price:
          type: number

    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        price:
          type: number
        createdAt:
          type: string
          format: date-time
